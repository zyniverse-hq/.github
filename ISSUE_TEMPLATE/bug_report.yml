name: "🐛 Bug Report"
description: Report a reproducible bug or unexpected behavior
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. Please fill in as much detail as possible.

  - type: input
    id: summary
    attributes:
      label: Summary
      description: A short description of the bug
      placeholder: e.g. "Login button does nothing on mobile"
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: How do we reproduce this bug?
      placeholder: |
        1. Go to ...
        2. Click on ...
        3. See error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What should have happened?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What actually happened?
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version / Release
      description: What version or branch is affected?
      placeholder: e.g. v1.2.3 or main

  - type: textarea
    id: context
    attributes:
      label: Additional Context
      description: Screenshots, logs, environment details, or anything else that helps.
